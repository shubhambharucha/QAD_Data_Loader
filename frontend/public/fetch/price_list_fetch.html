<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script src="/services/session.js"></script>
<script src="/services/authGuard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Price List - Data Extraction</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:#0a0510;
  color:#f8f8f8;
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
  cursor:none;
  -webkit-font-smoothing:antialiased;
}
:root{
  --accent:#8b5cf6;
  --accent-dim:rgba(139,92,246,.08);
  --accent-border:rgba(139,92,246,.18);
  --accent-glow:rgba(139,92,246,.27);
  --accent-bright:rgba(139,92,246,.35);
  --green:#00e676;
  --red:#dc3232;
  --red-bright:#dc5050;
  --warn:#e09020;
  --surface:rgba(255,255,255,.03);
  --surface-hover:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.07);
  --text:#f8f8f8;
  --muted:#a7a5b4;
  --muted2:#706e82;
  --mono:'DM Mono',monospace;
}
#cur{position:fixed;width:8px;height:8px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s,opacity .2s;}
#cur-ring{position:fixed;width:28px;height:28px;border:1px solid rgba(139,92,246,.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .3s;}
body.cur-hover #cur{width:14px;height:14px;background:#fff}
body.cur-hover #cur-ring{width:46px;height:46px;border-color:rgba(139,92,246,.6)}
#grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
#grid-bg svg{width:100%;height:100%;animation:grid-pulse 5s ease-in-out infinite;}
@keyframes grid-pulse{0%,100%{opacity:.38}50%{opacity:.9}}
#grid-bg::after{content:'';position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:1150px;height:900px;background:radial-gradient(ellipse at center,rgba(139,92,246,.17) 0%,rgba(139,92,246,.09) 35%,rgba(99,102,241,.06) 55%,transparent 75%);pointer-events:none;animation:bloom 7s ease-in-out infinite;}
@keyframes bloom{0%,100%{opacity:.58;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}
#nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;transition:background .4s,border-color .4s;border-bottom:1px solid transparent;background:rgba(10,5,16,.9);border-color:var(--border);backdrop-filter:blur(16px);}
.nav-logo{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;color:#fff;text-decoration:none;letter-spacing:-.01em;}
.nav-logo img{padding-top:20px;height:100px;object-fit:contain;}
.nav-links{display:flex;gap:36px}
.nav-links a{font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s;font-family:var(--mono);letter-spacing:.04em;}
.nav-links a:hover{color:var(--accent)}
.nav-settings{background:transparent;border:1px solid var(--accent-border);color:var(--accent);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;transition:all .2s;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;}
.nav-settings:hover{border-color:var(--accent);color:#fff;background:var(--accent-dim);box-shadow:0 0 20px rgba(139,92,246,.3);}
#hero{position:relative;min-height:180px;display:flex;align-items:center;justify-content:center;padding:0 52px;z-index:1;}
.hero-inner{text-align:center;padding-top:76px;}
.hero-h1{font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.03em;line-height:1.05;color:#fff;}
.divider{border:none;border-top:1px solid var(--border);margin:0;position:relative;z-index:1;}
#app{padding:44px 52px 60px;position:relative;z-index:1;min-height:100vh;}
.app-wrapper{display:grid;grid-template-columns:1fr 560px;gap:28px;align-items:start;max-width:1440px;margin:0 auto;}

/* ── LEFT COLUMN ── */
.left-col{display:flex;flex-direction:column;margin-top:-56px;}

.panel-label{font-size:clamp(19px,2.2vw,24px);font-weight:700;letter-spacing:-.03em;color:#fff;font-family:'Inter',sans-serif;margin-bottom:10px;}
.section-head-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.reset-row{display:flex;justify-content:flex-end;padding-top:10px;}

.filter-row{display:grid;grid-template-columns:132px 128px 130px 130px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.filter-row:last-of-type{border-bottom:none;}
.filter-label{font-size:13px;font-weight:500;color:#fff;letter-spacing:-.01em;}

select,input[type="text"],input[type="date"]{
  width:100%;
  background:#000;
  border:1px solid rgba(139,92,246,.3);
  color:#ffffff;
  font-family:'Inter',sans-serif;
  font-size:13px;
  padding:7px 10px;
  border-radius:5px;
  outline:none;
  transition:border-color .2s,box-shadow .2s,opacity .2s;
  box-shadow:0 0 0 rgba(139,92,246,0);
}
select:focus,input[type="text"]:focus,input[type="date"]:focus{
  border-color:var(--accent);
  box-shadow:0 0 14px rgba(139,92,246,.22);
}
select:hover:not(:disabled),input[type="text"]:hover:not(:disabled),input[type="date"]:hover:not(:disabled){
  border-color:var(--accent-border);
}
select:disabled,input:disabled{
  opacity:.32;
  cursor:not-allowed;
  border-color:rgba(255,255,255,.06);
  box-shadow:none;
}
select{cursor:pointer;color-scheme:dark;}
select option{background:#000;color:#ffffff;}
input[type="date"]{color-scheme:dark;}
input::placeholder{color:var(--muted2);}

.link-btn{
  background:transparent;border:1px solid var(--accent-border);color:var(--accent);
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 20px;border-radius:4px;cursor:pointer;transition:all .2s;
}
.link-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:#fff;box-shadow:0 0 16px rgba(139,92,246,.25);}

.section-divider{border:none;border-top:1px solid var(--border);margin:16px 0;}

.output-row{display:grid;grid-template-columns:minmax(0,340px);gap:24px;margin-bottom:18px;}
.field-block label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}

/* ── RUN BUTTON ── */
.run-row{display:flex;justify-content:center;margin-top:22px;}
.run-btn{
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:14px 64px;background:var(--accent-dim);color:#fff;border:1px solid var(--accent);
  cursor:pointer;border-radius:5px;transition:all .2s;display:flex;align-items:center;gap:10px;
  box-shadow:0 0 18px rgba(139,92,246,.3);
}
.run-btn:hover:not(:disabled){background:rgba(139,92,246,.18);box-shadow:0 0 30px rgba(139,92,246,.45);}
.run-btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;}
.spinner{width:11px;height:11px;border:1.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── RIGHT COLUMN / TERMINAL ── */
#terminal-panel{position:sticky;top:76px;height:600px;background:#0c0714;border:2px solid rgba(139,92,246,.2);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 36px rgba(139,92,246,.19),inset 0 0 26px rgba(139,92,246,.09);}
.term-header{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);}
.term-dot{width:10px;height:10px;border-radius:50%;}
.term-title{flex:1;text-align:center;font-family:var(--mono);font-size:14px;color:#fff;letter-spacing:.05em;text-transform:uppercase;}
.term-body{flex:1;overflow-y:auto;padding:16px 18px;font-family:var(--mono);font-size:14px;line-height:2;color:#fff;}
.term-body::-webkit-scrollbar{width:6px;}
.term-body::-webkit-scrollbar-track{background:transparent;}
.term-body::-webkit-scrollbar-thumb{background:rgba(139,92,246,.2);border-radius:3px;}
.term-body::-webkit-scrollbar-thumb:hover{background:rgba(139,92,246,.35);}
.term-line{display:flex;align-items:flex-start;gap:8px;margin-bottom:2px;}
.term-sym{flex-shrink:0;font-weight:500;width:20px;text-align:center;color:var(--accent);}
.term-sym.process{color:var(--accent)}
.term-sym.success{color:var(--green)}
.term-sym.fail{color:var(--red-bright)}
.term-sym.warn{color:var(--warn)}
.term-text{flex:1;word-break:break-word;color:#fff;}
.term-summary{margin-top:14px;padding-top:10px;border-top:1px solid rgba(139,92,246,.15);}
.term-summary-title{color:#fff;font-weight:700;letter-spacing:.06em;margin-bottom:8px;}
.term-summary-row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;padding:2px 0;}
.term-summary-row b{color:#fff;font-weight:500;}
.term-summary-row.status b{color:var(--green);}
.term-summary-row.status.fail b{color:var(--red-bright);}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .65s cubic-bezier(.4,0,.2,1),transform .65s cubic-bezier(.4,0,.2,1);}
.reveal.in{opacity:1;transform:none}

@media(max-width:1100px){.app-wrapper{grid-template-columns:1fr;}#terminal-panel{position:relative;top:0;height:460px;}}
@media(max-width:768px){#nav{padding:0 20px}#hero,#app{padding-left:20px;padding-right:20px}.filter-row{grid-template-columns:1fr;gap:6px;}.output-row{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="cur"></div>
<div id="cur-ring"></div>

<div id="grid-bg">
  <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
    <defs>
      <pattern id="smallgrid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,200,80,0.07)" stroke-width="0.5"/>
      </pattern>
      <pattern id="grid" width="200" height="200" patternUnits="userSpaceOnUse">
        <rect width="200" height="200" fill="url(#smallgrid)"/>
        <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(0,200,80,0.12)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </svg>
</div>

<nav id="nav">
  <a href="/workspace.html" class="nav-logo">
    <img src="/logo.png" alt="Yash Technologies"/>
    <span></span>
  </a>
  <div class="nav-links">
    <a href="/workspace.html">App</a>
  </div>
  <button class="nav-settings" onclick="window.location.href='/workspace.html'" title="Back to App">← Back</button>
</nav>

<section id="hero">
  <div class="hero-inner">
    <h1 class="hero-h1">Price List - Data Extraction</h1>
  </div>
</section>

<hr class="divider"/>

<section id="app">
  <div class="app-wrapper">

    <div class="left-col reveal" id="left-col">

      <div class="panel-label">Filters</div>

      <div id="filters-body"></div>

      <div class="reset-row">
        <button class="link-btn" id="btn-reset">Reset Filters</button>
      </div>

      <hr class="section-divider"/>

      <div class="panel-label">Extraction Output</div>

      <div class="output-row">
        <div class="field-block">
          <label for="in-filename">File Name</label>
          <input type="text" id="in-filename"/>
        </div>
      </div>

      <div class="run-row">
        <button class="run-btn" id="btn-run" disabled>
          <span class="spinner" id="sp-run" style="display:none"></span>
          Run
        </button>
      </div>

    </div>

    <div id="terminal-panel" class="reveal d1">
      <div class="term-header">
        <div class="term-dot" style="background:#ff5f57"></div>
        <div class="term-dot" style="background:#febc2e"></div>
        <div class="term-dot" style="background:#28c840"></div>
        <div class="term-title">Live Extraction Log</div>
      </div>
      <div class="term-body" id="term-body">
        <div style="color:var(--muted2);font-size:10px;margin-top:4px;">Ready to fetch price lists</div>
      </div>
    </div>

  </div>
</section>

<footer style="padding:28px 52px;border-top:1px solid var(--border);position:relative;z-index:1;">
  <div style="font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);">QAD Data Loader</div>
</footer>

<script src="/services/api.js"></script>

<script>
/* ── CURSOR (same behavior as index.html) ── */
const cur=document.getElementById('cur');
const ring=document.getElementById('cur-ring');
let mx=window.innerWidth/2,my=window.innerHeight/2,rx=mx,ry=my;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
(function loop(){rx+=(mx-rx)*.1;ry+=(my-ry)*.1;ring.style.left=Math.round(rx)+'px';ring.style.top=Math.round(ry)+'px';requestAnimationFrame(loop);})();
function bindCursor(el){
  el.addEventListener('mouseenter',()=>document.body.classList.add('cur-hover'));
  el.addEventListener('mouseleave',()=>document.body.classList.remove('cur-hover'));
}
document.querySelectorAll('a,button').forEach(bindCursor);

window.addEventListener('scroll',()=>{document.getElementById('nav').classList.toggle('scrolled',window.scrollY>40);});

/* ── TERMINAL (same pattern as index.html) ── */
const Terminal={
  body:document.getElementById('term-body'),
  clear(){this.body.innerHTML='';},
  log(text,symbol='•',type='text'){
    const line=document.createElement('div');
    line.className='term-line';
    const sym=document.createElement('div');
    sym.className='term-sym '+type;
    sym.textContent=symbol;
    const txt=document.createElement('div');
    txt.className='term-text';
    txt.textContent=text;
    line.appendChild(sym);line.appendChild(txt);
    this.body.appendChild(line);
    this.body.scrollTop=this.body.scrollHeight;
  },
  summary({rows,filename,location,ok,warnLarge}){
    const wrap=document.createElement('div');
    wrap.className='term-summary';
    const title=document.createElement('div');
    title.className='term-summary-title';
    title.textContent='FETCH SUMMARY';
    wrap.appendChild(title);

    const rowsRow=document.createElement('div');
    rowsRow.className='term-summary-row';
    rowsRow.innerHTML=`<span>Records Found</span><b>${rows}</b>`;
    wrap.appendChild(rowsRow);

    const fileRow=document.createElement('div');
    fileRow.className='term-summary-row';
    fileRow.innerHTML=`<span>Workbook Created</span><b>${filename}</b>`;
    wrap.appendChild(fileRow);

    const locRow=document.createElement('div');
    locRow.className='term-summary-row';
    locRow.innerHTML=`<span>Location</span><b>${location}</b>`;
    wrap.appendChild(locRow);

    const statusRow=document.createElement('div');
    statusRow.className='term-summary-row status'+(ok?'':' fail');
    statusRow.innerHTML=`<span>Status</span><b>${ok?'✔ Completed Successfully':'✘ Failed'}</b>`;
    wrap.appendChild(statusRow);

    this.body.appendChild(wrap);

    if(warnLarge){
      this.log('Large extraction detected.','⚠','warn');
      this.log('Workbook generation may take additional time.','⚠','warn');
    }

    this.body.scrollTop=this.body.scrollHeight;
  }
};

/* ── FILTER FIELD DEFINITIONS ──
   field keys line up 1:1 with UI_FIELD_TO_QAD in Scripts/price_list_fetch.py */
const AMOUNT_TYPE_OPTIONS=[
  'List Price','Discount %','Discount Amt','Freight Terms','Freight List','Credit Terms'
];

const OPERATORS=[
  {value:'equals',label:'Equals'},
  {value:'starts with',label:'Starts With'},
  {value:'ends with',label:'Ends With'},
  {value:'contains',label:'Contains'},
  {value:'range',label:'Range'},
];

const FIELDS=[
  {key:'domain',      label:'Domain',             kind:'text'},
  {key:'price_list',  label:'Price List',        kind:'text'},
  {key:'customer',    label:'Customer',           kind:'text'},
  {key:'item',        label:'Item',               kind:'text'},
  {key:'currency',    label:'Currency',           kind:'text'},
  {key:'uom',         label:'Unit Of Measure',    kind:'text'},
  {key:'start_date',  label:'Start Date',         kind:'date'},
  {key:'expire_date', label:'Expire Date',        kind:'date'},
  {key:'amount_type', label:'Amount Type',        kind:'select', options:AMOUNT_TYPE_OPTIONS},
];

const filtersBody=document.getElementById('filters-body');

function buildValueControl(field,slot){
  // slot: 'from' | 'to' — determines the id suffix
  const id=`f-${field.key}-${slot}`;
  if(field.kind==='select'){
    const sel=document.createElement('select');
    sel.id=id;
    const blank=document.createElement('option');
    blank.value='';blank.textContent='—';
    sel.appendChild(blank);
    field.options.forEach(opt=>{
      const o=document.createElement('option');
      o.value=opt;o.textContent=opt;
      sel.appendChild(o);
    });
    bindCursor(sel);
    return sel;
  }
  const input=document.createElement('input');
  input.type=field.kind==='date'?'date':'text';
  input.id=id;
  if(field.kind==='text')input.placeholder='Value';
  bindCursor(input);
  return input;
}

FIELDS.forEach(field=>{
  const row=document.createElement('div');
  row.className='filter-row';

  const label=document.createElement('div');
  label.className='filter-label';
  label.textContent=field.label;

  const opSel=document.createElement('select');
  opSel.id=`op-${field.key}`;
  OPERATORS.forEach(op=>{
    const o=document.createElement('option');
    o.value=op.value;o.textContent=op.label;
    opSel.appendChild(o);
  });
  bindCursor(opSel);

  const val1=buildValueControl(field,'from');
  const val2=buildValueControl(field,'to');
  val2.disabled=true; // Value 2 stays visible at all times, just disabled until Range

  opSel.addEventListener('change',()=>{
    const isRange=opSel.value==='range';
    val2.disabled=!isRange;
    if(!isRange) val2.value='';
  });

  row.appendChild(label);
  row.appendChild(opSel);
  row.appendChild(val1);
  row.appendChild(val2);
  filtersBody.appendChild(row);
});

/* ── RESET FILTERS ── */
document.getElementById('btn-reset').addEventListener('click',()=>{
  FIELDS.forEach(field=>{
    document.getElementById(`op-${field.key}`).value='equals';
    const v1=document.getElementById(`f-${field.key}-from`);
    const v2=document.getElementById(`f-${field.key}-to`);
    v1.value='';
    v2.value='';
    v2.disabled=true;
  });
});

/* ── COLLECT FILTERS FOR SUBMISSION ── */
function collectFilters(){
  const out=[];
  FIELDS.forEach(field=>{
    const operator=document.getElementById(`op-${field.key}`).value;
    const value_from=document.getElementById(`f-${field.key}-from`).value.trim();
    const value_to=document.getElementById(`f-${field.key}-to`).value.trim();
    if(!value_from && !value_to) return; // empty row — not sent
    out.push({field:field.key,operator,value_from:value_from||null,value_to:value_to||null});
  });
  return out;
}

/* ── FILE NAME DEFAULT ── */
const btnRun=document.getElementById('btn-run');
const inFilename=document.getElementById('in-filename');

function timestampedFilename(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  return `PriceList_${stamp}.xlsx`;
}
inFilename.value=timestampedFilename();

function syncRunEnabled(){
  const filename=inFilename.value.trim();
  btnRun.disabled = !(filename.length>0);
}
inFilename.addEventListener('input',syncRunEnabled);
syncRunEnabled();

/* ── RUN ── */
let running=false;

async function delay(ms){return new Promise(r=>setTimeout(r,ms));}

btnRun.addEventListener('click',async()=>{
  if(running||btnRun.disabled)return;
  running=true;
  btnRun.disabled=true;
  document.getElementById('sp-run').style.display='';

  Terminal.clear();
  Terminal.log('Connecting to QAD...','▸','process');
  await delay(400);
  Terminal.log('Executing Browse Query...','▸','process');
  await delay(400);
  Terminal.log('Fetching records...','▸','process');

  const filename=inFilename.value.trim();
  const filters=collectFilters();

  let result=null;
  try{
    const res=await fetch(`${API}/api/fetch-price-list`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filters,filename})
    });
    result=await res.json();
  }catch(e){
    Terminal.log('Connection error: '+e.message,'✘','fail');
    running=false;
    btnRun.disabled=false;
    document.getElementById('sp-run').style.display='none';
    return;
  }

  Terminal.log('Generating workbook...','▸','process');
  await delay(300);
  Terminal.log('Saving workbook to Downloads...','▸','process');
  await delay(300);

  if(result && result.ok){
    Terminal.log('Workbook saved successfully.','✔','success');
    Terminal.summary({
      rows:result.rows||0,
      filename:result.filename||filename,
      location:'Downloads',
      ok:true,
      warnLarge:(result.rows||0)>2000,
    });
  }else{
    Terminal.log((result&&result.message)||'Extraction failed','✘','fail');
    Terminal.summary({
      rows:(result&&result.rows)||0,
      filename:filename,
      location:'Downloads',
      ok:false,
      warnLarge:false,
    });
  }

  running=false;
  document.getElementById('sp-run').style.display='none';
  syncRunEnabled();
});

/* ── SCROLL REVEAL ── */
const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
},{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){
  document.getElementById('grid-bg').style.animation='none';
}
</script>
</body>
</html>
